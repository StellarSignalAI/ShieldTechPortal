<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>ShieldTech Unified Portal</title>
  <link rel="icon" type="image/png" href="./sw/shieldtech-emblem.png" />
  <!-- Installable app (PWA) -->
  <link rel="manifest" href="/manifest-portal.webmanifest" />
  <meta name="theme-color" content="#0A0E14" />
  <link rel="apple-touch-icon" href="./sw/shieldtech-emblem.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ShieldTech" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Inter typeface — ShieldTech design language (UniFi-pattern console) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' }).then(function (reg) {
          // Re-check for a new build whenever the app is opened or foregrounded,
          // so installed PWAs pick up deploys without a manual cache clear.
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update().catch(function () {});
          });
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
